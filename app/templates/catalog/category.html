{% extends "common/base.html" %}

{% block content %}
<div id="BackLink">
    <a href="/catalog">Return to Main Menu</a>
</div>

<div id="Catalog">
    <h2>{{ category.name }}</h2>

    <table>
        <tr>
            <th>Product ID</th>
            <th>Name</th>
        </tr>
        {% for product in product_list %}
        <tr>
            <td><a href="/catalog/products/{{ product.productid }}">{{ product.productid }}</a></td>
            <td>{{ product.name }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
