{% extends "common/base.html" %}

{% block content %}
<div id="Welcome">
    <div id="WelcomeContent">
        {% if user %}
            Welcome {{ user.firstname }}!
        {% else %}
            Welcome to JPetStore 6!
        {% endif %}
    </div>
</div>

<div id="Main">
    <div id="Sidebar">
        <div id="SidebarContent">
            <a href="/catalog/categories/FISH"><img src="/static/images/fish_icon.gif" alt="Fish"></a><br>Saltwater, Freshwater<br>
            <a href="/catalog/categories/DOGS"><img src="/static/images/dogs_icon.gif" alt="Dogs"></a><br>Various Breeds<br>
            <a href="/catalog/categories/CATS"><img src="/static/images/cats_icon.gif" alt="Cats"></a><br>Various Breeds, Exotic Varieties<br>
            <a href="/catalog/categories/REPTILES"><img src="/static/images/reptiles_icon.gif" alt="Reptiles"></a><br>Lizards, Turtles, Snakes<br>
            <a href="/catalog/categories/BIRDS"><img src="/static/images/birds_icon.gif" alt="Birds"></a><br>Exotic Varieties
        </div>
    </div>

    <div id="MainImage">
        <div id="MainImageContent">
            <map name="estoremap">
                <area alt="Birds" coords="72,2,280,250" href="/catalog/categories/BIRDS" shape="RECT">
                <area alt="Fish" coords="2,180,72,250" href="/catalog/categories/FISH" shape="RECT">
                <area alt="Dogs" coords="60,250,130,320" href="/catalog/categories/DOGS" shape="RECT">
                <area alt="Reptiles" coords="0,0,60,60" href="/catalog/categories/REPTILES" shape="RECT">
                <area alt="Cats" coords="225,240,295,310" href="/catalog/categories/CATS" shape="RECT">
                <area alt="Birds" coords="280,180,350,250" href="/catalog/categories/BIRDS" shape="RECT">
            </map>
            <img src="/static/images/splash.gif" border="0" usemap="#estoremap" alt="JPetStore Splash">
        </div>
    </div>
    <div id="Separator">&nbsp;</div>
</div>
{% endblock %}
