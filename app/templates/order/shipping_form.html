{% extends "common/base.html" %}

{% block content %}
<div id="Catalog">
    <h2>Shipping Address</h2>

    <form method="post" action="/order/shipping">
        <table>
            <tr>
                <th colspan="2">Shipping Address</th>
            </tr>
            <tr>
                <td>First name:</td>
                <td><input type="text" name="shipToFirstName" value="{{ order.shipToFirstName }}" required></td>
            </tr>
            <tr>
                <td>Last name:</td>
                <td><input type="text" name="shipToLastName" value="{{ order.shipToLastName }}" required></td>
            </tr>
            <tr>
                <td>Address 1:</td>
                <td><input type="text" size="40" name="shipAddress1" value="{{ order.shipAddress1 }}" required></td>
            </tr>
            <tr>
                <td>Address 2:</td>
                <td><input type="text" size="40" name="shipAddress2" value="{{ order.shipAddress2 }}"></td>
            </tr>
            <tr>
                <td>City:</td>
                <td><input type="text" name="shipCity" value="{{ order.shipCity }}" required></td>
            </tr>
            <tr>
                <td>State:</td>
                <td><input type="text" size="4" name="shipState" value="{{ order.shipState }}" required></td>
            </tr>
            <tr>
                <td>Zip:</td>
                <td><input type="text" size="10" name="shipZip" value="{{ order.shipZip }}" required></td>
            </tr>
            <tr>
                <td>Country:</td>
                <td><input type="text" size="15" name="shipCountry" value="{{ order.shipCountry }}" required></td>
            </tr>
        </table>
        <br>
        <input type="submit" value="Continue" class="Button">
    </form>
</div>
{% endblock %}
