[project]
name = "jpetstore-fastapi"
version = "1.0.0"
description = "AI-Native Modernized JPetStore 6 (FastAPI, SQLAlchemy 2.0, Jinja2, OpenAPI 3.1)"
authors = [{ name = "AI Modernization Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.3",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "itsdangerous>=2.1.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort imports
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit security
]
ignore = [
    "S101", # assert allowed in tests
    "S105", # hardcoded password warnings in seeded fixtures/templates
    "S106", # hardcoded password in auth test fixtures
    "S107", # hardcoded password in parameters
    "S311", # pseudo-random generators when not cryptographic
    "B008", # do not perform function calls in argument defaults (standard for FastAPI Depends)
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".git"]
skips = ["B101", "B104", "B105", "B106", "B107"]
